# GPU/OptiX counterpart to build-and-test.yml -- runs on a self-hosted
# runner with a real NVIDIA GPU (`runs-on: [self-hosted, gpu]`; GitHub-hosted
# runners have no GPU/CUDA at all, so this can't run there). Covers rmagine's
# own OptiX CTest suite, which the CPU workflow silently skips.
#
# NOT exercised against a live runner yet -- no self-hosted GPU runner is
# registered for this repo (or any of the other three) as of writing. See
# MIGRATION_HANDOFF.md, "Phase 2: CI on a real runner", for what's needed to
# actually turn this on: register a self-hosted runner labeled `gpu` against
# this repo (Settings > Actions > Runners), with a real NVIDIA GPU + driver
# and a working OptiX SDK on disk, then set the OPTIX_INCLUDE_DIR repository
# variable (Settings > Secrets and variables > Actions > Variables) to that
# SDK's include/ dir. See radarays_gazebo_plugins/scripts/
# ci_build_and_test_gpu.sh's header comment for why there's deliberately no
# hardcoded default for that path -- a wrong-but-present default already
# silently broke this migration once.
name: build-and-test-gpu
on:
  push:
    branches: [main, ros2-jazzy-harmonic]
  pull_request:
    branches: [main, ros2-jazzy-harmonic]
  workflow_dispatch:

jobs:
  build-and-test-gpu:
    runs-on: [self-hosted, gpu]
    env:
      OPTIX_INCLUDE_DIR: ${{ vars.OPTIX_INCLUDE_DIR }}
    steps:
      - name: Checkout radarays_ros
        uses: actions/checkout@v4
        with:
          path: ws/src/radarays_ros

      - name: Checkout sibling packages
        run: |
          # Clones sibling packages from this workspace's own forks
          # (sotomotocross/*) at ros2-jazzy-harmonic. This is the real,
          # permanent development line now, not a staging step for an
          # upstream PR -- see MIGRATION_HANDOFF.md for why (amock's own
          # rewrite superseded rmagine_gazebo_plugins upstream; we're
          # continuing independently on our forks rather than chasing
          # that merge).
          set -euxo pipefail
          rm -rf ws/src/rmagine
          git clone --depth 1 --branch ros2-jazzy-harmonic https://github.com/sotomotocross/rmagine.git ws/src/rmagine
          rm -rf ws/src/rmagine_gazebo_plugins
          git clone --depth 1 --branch ros2-jazzy-harmonic https://github.com/sotomotocross/rmagine_gazebo_plugins.git ws/src/rmagine_gazebo_plugins
          rm -rf ws/src/radarays_gazebo_plugins
          git clone --depth 1 --branch ros2-jazzy-harmonic https://github.com/sotomotocross/radarays_gazebo_plugins.git ws/src/radarays_gazebo_plugins

      - name: Install ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install Gazebo Harmonic and workspace system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ros-jazzy-ros-gz \
            ros-jazzy-tf2-ros \
            ros-jazzy-cv-bridge \
            ros-jazzy-image-transport \
            libopencv-dev \
            libyaml-cpp-dev \
            libtbb-dev \
            libassimp-dev \
            libeigen3-dev

      - name: rosdep install
        run: |
          set -euxo pipefail
          # ROS 2's setup.bash references variables it doesn't guarantee are
          # set (e.g. AMENT_TRACE_SETUP_FILES) -- not compatible with `set -u`.
          # Found the hard way: this step failed on a real runner with
          # "AMENT_TRACE_SETUP_FILES: unbound variable" the first time this
          # workflow actually ran (see ci_build_and_test.sh, which already had
          # this same fix -- just never applied to this inline step before).
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          cd ws
          rosdep update
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy || true

      - name: Build workspace and run GPU/OptiX regression tests
        run: |
          chmod +x ws/src/radarays_gazebo_plugins/scripts/ci_build_and_test_gpu.sh
          ws/src/radarays_gazebo_plugins/scripts/ci_build_and_test_gpu.sh
